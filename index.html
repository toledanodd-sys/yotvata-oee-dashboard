<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OEE יטבתה</title>
<meta name="theme-color" content="#1c2b45">
<meta name="description" content="דשבורד ביצועי ייצור — מחלבת יטבתה">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OEE יטבתה">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="appbar">
  <div>
    <div class="appbar-title">OEE · יטבתה</div>
    <div class="appbar-role">מנהל ייצור — תצוגת מפעל יומית</div>
  </div>
  <div class="appbar-end">
    <nav class="role-seg" aria-label="תפקיד"><a id="role-plant" href="#/">מנהל ייצור</a><a id="role-ll" href="#/ll">LL</a><a id="role-pl" href="#/pl">PL</a><a id="role-ml" href="#/ml">ML</a><a id="role-dds" href="#/dds">DDS</a></nav>
    <div id="conn" class="conn conn-wait">טוען…</div>
    <a id="upload-link" class="appbar-gear" href="#/upload" aria-label="העלאת דוחות" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></a>
    <a id="gear" class="appbar-gear" href="#/settings" aria-label="הגדרות"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
</header>
<main id="root"></main>
<main id="ll-root" hidden></main>
<main id="pl-root" hidden></main>
<main id="ml-root" hidden></main>
<main id="dds-root" hidden></main>
<main id="settings-root" hidden></main>
<main id="upload-root" hidden></main>
<template id="view">
<div class="page">

  <sc-if value="{{showBanner}}"><div class="banner">{{bannerText}}</div></sc-if>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
    <div>
      <div style="font-size: 22px; font-weight: 700; margin-bottom: 2px;">מנהל ייצור — תצוגת מפעל</div>
      <div style="font-size: 12.5px; color: #8A8776; margin-bottom: 14px;">מקור: דוחות OEE ואירועים גולמיים מה-MES</div>

      <div class="pbar">
        <div class="pseg" role="group" aria-label="תקופת ניתוח">
          <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
            <button class="pseg-btn" type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button>
          </sc-for>
        </div>
        <div class="pnav">
          <button class="pnav-btn" type="button" aria-label="תקופה קודמת" style="{{prevStyle}}" onClick="{{prevFn}}">→</button>
          <span class="pnav-label">{{periodLabel}}</span>
          <button class="pnav-btn" type="button" aria-label="תקופה הבאה" style="{{nextStyle}}" onClick="{{nextFn}}">←</button>
        </div>
        <span class="psrc" style="{{srcStyle}}">{{srcLabel}}</span>
      </div>
      <div class="psrc-note">{{srcNote}}</div>

      <div class="section-title">מפעל — סה״כ</div>
      <div class="stat-row" style="margin-bottom: 24px;">
        <sc-for list="{{plantStats}}" as="s" hint-placeholder-count="4">
          <div class="card card-plant">
            <div class="l">{{s.l}}</div><div class="v">{{s.v}}</div><div class="n">{{s.n}}</div>
            <sc-if value="{{s.hasSrc}}" hint-placeholder-val="{{false}}"><div class="kpi-src">{{s.src}}</div></sc-if>
            <div class="kpi-tooltip">
              <div class="kpi-tooltip-title">השוואה מול תקופות קודמות</div>
              <div class="kpi-tooltip-row"><span>{{s.tt.prevLabel}}</span><b>{{s.tt.yest}}</b></div>
              <div class="kpi-tooltip-sub">{{s.tt.yestDelta}}</div>
              <div class="kpi-tooltip-row" style="margin-top:6px;"><span>{{s.tt.avgLabel}}</span><b>{{s.tt.week}}</b></div>
              <div class="kpi-tooltip-sub">{{s.tt.weekDelta}}</div>
              <div class="kpi-tooltip-note">* מאותו סוג תקופה, לפי הדוחות שהועלו. "—" = אין נתון לתקופה הזו</div>
            </div>
          </div>
        </sc-for>
      </div>

      <div class="panel" style="margin-bottom: 8px;">
        <div class="panel-title">התראות וחריגים — איפה למקד פעולה היום</div>
        <div class="panel-sub">מדורג לפי נק' OEE מפעלי אבודות מול היעד <b>העצמי</b> של כל מכונה (משקל × (יעד − בפועל)) — לא מול ממוצע מפעלי משותף, כדי שמכונות עם יעדים שונים במהותם (למשל גלאקסי עם יעד 35% מול קומבי עם יעד 60%) יושוו נכון, כל אחת מול המצופה ממנה</div>

        <div class="alert-grid">
          <sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
            <div class="alert-row" style="{{a.rowStyle}}">
              <span class="alert-dot" style="{{a.dotStyle}}"></span>
              <div class="alert-text"><b>{{a.title}}</b><span>{{a.detail}}</span></div>
            </div>
          </sc-for>
        </div>
      </div>

      <div class="section-title-sub">ביצועי OEE — למה ה-OEE נמוך</div>
      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-title">OEE לפי מכונה (מהגבוה לנמוך)</div>
          <div class="panel-sub" style="margin-bottom:10px;">הקו המקווקו הוא יעד ה-OEE של המכונה (Machine_OEE_Target) · ירוק = עמדו/חצו את היעד, אדום = לא עמדו ביעד</div>
          <div class="chart-bars">
            <sc-for list="{{oeeChart}}" as="b" hint-placeholder-count="8">
              <div class="chart-col">
                <div class="bar-val-v">{{b.valueLabel}}</div>
                <div class="bar-track-v">
                  <div class="target-line" style="bottom: {{b.targetHeight}};"></div>
                  <div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div>
                </div>
                <div class="chart-name">{{b.name}}</div>
              </div>
            </sc-for>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-title">תרומה ל-OEE המפעלי — ביצוע מול יעד, לפי מכונה</div>
          <div class="panel-sub" style="margin-bottom:10px;">כל שורה מנורמלת ליעד <b>שלה</b> (לא לערך מוחלט משותף), כך שמכונה קטנה וגדולה מקבלות סרגל קריא באותו אורך. הסמן השחור הוא נקודת היעד (משקל × יעד OEE). ירוק = עברה את הסמן, אדום = לא הגיעה אליו. המספר הבולט הוא התרומה בפועל בנקודות OEE למפעל, ולצידו יעד התרומה שלה (משקל × יעד OEE) לצורך השוואה</div>
          <div class="bullet-list">
            <sc-for list="{{contributionBulletChart}}" as="b" hint-placeholder-count="8">
              <div class="bullet-row">
                <div class="bullet-name">{{b.name}}</div>
                <div class="bullet-track">
                  <div class="bullet-fill" style="width: {{b.fillWidth}}; {{b.colorStyle}}"></div>
                  <div class="bullet-target" style="right: {{b.targetPos}};"></div>
                </div>
                <div class="bullet-values">
                  <span class="bullet-points" style="{{b.labelColorStyle}}">{{b.pointsLabel}}</span>
                  <span class="bullet-pct">{{b.targetLabel}}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>

      <div class="section-title-sub">אמינות ותפעול — מה גורם לעצירות</div>
      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-title">TDT% (זמן עצירות) לפי מכונה (מהגבוה לנמוך)</div>
          <div class="filter-tabs">
            <span class="filter-tab" style="{{tdtViewMachineTabStyle}}" onClick="{{setTdtViewMachineFn}}">לפי מכונה</span>
            <span class="filter-tab" style="{{tdtViewStationsTabStyle}}" onClick="{{setTdtViewStationsFn}}">TOP 3 תקלות לפי תחנה</span>
          </div>

          <sc-if value="{{isTdtViewMachine}}" hint-placeholder-val="{{true}}">
            <div class="panel-sub" style="margin-bottom:10px;">אחוז מזמן העבודה שהמכונה עמדה — אחד הגורמים הישירים לפער ב-OEE. אין כרגע יעד מוגדר למדד הזה, ולכן העמודות בצבע אחיד ולא ירוק/אדום</div>
            <div class="chart-bars">
              <sc-for list="{{tdtChart}}" as="b" hint-placeholder-count="8">
                <div class="chart-col">
                  <div class="bar-val-v">{{b.valueLabel}}</div>
                  <div class="bar-track-v"><div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div></div>
                  <div class="chart-name">{{b.name}}</div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{isTdtViewStations}}" hint-placeholder-val="{{false}}">
            <div class="panel-sub" style="margin-bottom:10px;">לכל מכונה — 3 התחנות עם משך מצטבר הגבוה ביותר של עצירות מסוג "תקלה" בלבד (מתוך דוח RAW הגולמי, לא סטטוסים אחרים כמו הפסקה/המתנה/סט-אפ), ממוין מהגבוה לנמוך</div>
            <div class="top3-list">
              <sc-for list="{{tdtStationFaults}}" as="m" hint-placeholder-count="8">
                <div class="top3-machine-block">
                  <div class="top3-machine-name"><span>{{m.name}}</span><span class="top3-machine-tdt">{{m.tdtLabel}}</span></div>
                  <sc-for list="{{m.stations}}" as="s" hint-placeholder-count="3">
                    <div class="top3-reason-row">
                      <div class="top3-reason-desc">{{s.station}}</div>
                      <div class="top3-reason-stats">
                        <div class="top3-reason-dur">{{s.durLabel}}</div>
                        <div class="top3-reason-count">{{s.countLabel}}</div>
                      </div>
                    </div>
                  </sc-for>
                  <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                    <div class="top3-empty">אין עצירות מסוג "תקלה" בתקופה</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <div class="chart-card">
          <div class="chart-title">MTBF (זמן ממוצע בין תקלות) לפי מכונה (מהנמוך לגבוה)</div>
          <div class="filter-tabs">
            <span class="filter-tab" style="{{mtbfViewMachineTabStyle}}" onClick="{{setMtbfViewMachineFn}}">לפי מכונה</span>
            <span class="filter-tab" style="{{mtbfViewFaultsTabStyle}}" onClick="{{setMtbfViewFaultsFn}}">TOP 3 תיאורי תקלה</span>
          </div>

          <sc-if value="{{isMtbfViewMachine}}" hint-placeholder-val="{{true}}">
            <div class="panel-sub" style="margin-bottom:10px;">שעות:דקות בין תקלה לתקלה — ככל שנמוך יותר, המכונה נכשלת בתדירות גבוהה יותר. "אין תקלות" = לא נרשמו למכונה אירועי תקלה בתקופה</div>
            <div class="chart-bars">
              <sc-for list="{{mtbfChart}}" as="b" hint-placeholder-count="8">
                <div class="chart-col">
                  <div class="bar-val-v">{{b.valueLabel}}</div>
                  <div class="bar-track-v"><div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div></div>
                  <div class="chart-name">{{b.name}}</div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{isMtbfViewFaults}}" hint-placeholder-val="{{false}}">
            <div class="panel-sub" style="margin-bottom:10px;">לכל מכונה — 3 תיאורי התקלה עם מספר המופעים הגבוה ביותר (סטטוס "תקלה" בלבד מדוח RAW), ממוין מהנמוך לגבוה ב-MTBF כמו הגרף. תיאורים <span style="font-style:italic; color:#D97706; font-weight:700;">מודגשים בכתום</span> (למשל "אחר", "עצירה לא מוסברת") אינם מסבירים את סיבת התקלה בפועל — סימן לתיעוד לקוי בשטח שכדאי לשפר, לא לתקלה חוזרת אמיתית</div>
            <div class="top3-list">
              <sc-for list="{{mtbfTop3Faults}}" as="m" hint-placeholder-count="8">
                <div class="top3-machine-block">
                  <div class="top3-machine-name"><span>{{m.name}}</span><span class="top3-machine-tdt">{{m.mtbfLabel}}</span></div>
                  <sc-for list="{{m.faults}}" as="f" hint-placeholder-count="3">
                    <div class="top3-reason-row">
                      <div class="top3-reason-desc" style="{{f.descStyle}}">{{f.desc}}</div>
                      <div class="top3-reason-station">{{f.station}}</div>
                      <div class="top3-reason-stats">
                        <div class="top3-reason-dur">{{f.countLabel}}</div>
                        <div class="top3-reason-count">{{f.durLabel}}</div>
                      </div>
                    </div>
                  </sc-for>
                  <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                    <div class="top3-empty">אין עצירות מסוג "תקלה" בתקופה</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </div>

      <div class="section-title-sub">תפוקה</div>
      <div class="chart-card">
        <div class="chart-title">תפוקה — מוחלטת ואחוז מהמפעל, ביחד</div>
        <div class="filter-tabs">
          <span class="filter-tab" style="{{shareDeptTabStyle}}" onClick="{{setShareDeptFn}}">לפי אגף</span>
          <span class="filter-tab" style="{{shareMachineTabStyle}}" onClick="{{setShareMachineFn}}">לפי מכונה</span>
          <span class="filter-tab" style="{{shareSkuTabStyle}}" onClick="{{setShareSkuFn}}">פירוט מק"טים</span>
        </div>

        <sc-if value="{{isShareMachine}}" hint-placeholder-val="{{false}}">
          <div class="panel-sub" style="margin-bottom:10px;">ממוין מהגבוה לנמוך · המספר העליון = תפוקה בפועל (SAP טובים), המספר התחתון = אחוז מהתפוקה המפעלית</div>
          <div class="chart-bars">
            <sc-for list="{{outputCombinedChart}}" as="b" hint-placeholder-count="8">
              <div class="chart-col">
                <div class="bar-val-v">{{b.valueLabel}}</div>
                <div class="bar-val-sub">{{b.shareLabel}}</div>
                <div class="bar-track-v"><div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div></div>
                <div class="chart-name">{{b.name}}</div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isShareDept}}" hint-placeholder-val="{{true}}">
          <div class="panel-sub" style="margin-bottom:10px;">מצטבר לרמת אגף · תפוקה בפועל ואחוז מהמפעל ביחד</div>
          <div class="pie-wrap-dept">
            <svg width="190" height="190" viewBox="0 0 200 200">
              <sc-for list="{{outputCombinedDeptPie}}" as="p" hint-placeholder-count="4">
                <path d="{{p.path}}" style="{{p.fillStyle}}" stroke="#fff" stroke-width="2.5"></path>
              </sc-for>
              <sc-for list="{{outputCombinedDeptPie}}" as="p" hint-placeholder-count="4">
                <sc-if value="{{p.showLabel}}" hint-placeholder-val="{{false}}">
                  <text x="{{p.labelX}}" y="{{p.labelY}}" class="pie-slice-label">
                    <tspan x="{{p.labelX}}" dy="-6">{{p.valueLabel}}</tspan>
                    <tspan x="{{p.labelX}}" dy="16" class="pie-slice-sub">{{p.shareLabel}}</tspan>
                  </text>
                </sc-if>
              </sc-for>
            </svg>
            <div class="pie-legend">
              <sc-for list="{{outputCombinedDeptPie}}" as="p" hint-placeholder-count="4">
                <div class="pie-legend-item">
                  <span class="pie-legend-dot" style="{{p.dotStyle}}"></span>
                  <span class="pie-legend-name">{{p.name}}</span>
                  <span class="pie-legend-pct">{{p.valueLabel}}</span>
                  <span class="pie-legend-sub">({{p.shareLabel}})</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{isShareSku}}" hint-placeholder-val="{{false}}">
          <div class="panel-sub" style="margin-bottom:10px;">לכל מכונה — כל המק"טים שיוצרו, ממוין מהגבוה לנמוך לפי כמות התפוקה; המכונות עצמן מסודרות כמו בגרף "לפי מכונה"</div>
          <div class="banner" style="display:block; margin-bottom:14px;">הכמויות כאן מדווחות ברמת מק"ט מתוך ה-MES ואינן בהכרח תואמות במדויק את התפוקה הרשמית מ-SAP המוצגת בגרף ובכרטיסי העל — פער הדיווח בין שתי המערכות הוא מצב קיים.</div>
          <div class="top3-list">
            <sc-for list="{{productionSkuList}}" as="m" hint-placeholder-count="8">
              <div class="top3-machine-block">
                <div class="top3-machine-name"><span>{{m.name}}</span><span class="top3-machine-tdt">{{m.totalLabel}}</span></div>
                <sc-for list="{{m.skus}}" as="p" hint-placeholder-count="4">
                  <div class="top3-reason-row">
                    <div class="top3-sku-code">{{p.sku}}</div>
                    <div class="top3-reason-desc">{{p.desc}}</div>
                    <div class="top3-reason-stats">
                      <div class="top3-reason-dur">{{p.qtyLabel}}</div>
                    </div>
                  </div>
                </sc-for>
                <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                  <div class="top3-empty">אין נתוני ייצור מק"ט בתקופה</div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>

    </div>
  </sc-if>

  <sc-if value="{{isDrill}}" hint-placeholder-val="{{false}}">
    <div>
      <button class="backbtn" onClick="{{onBack}}">→ חזרה לתצוגת המפעל</button>
      <div style="font-size: 20px; font-weight: 700; margin-bottom: 2px;">{{drillDeptName}}</div>
      <div style="font-size: 11px; color: #8A8776; margin-bottom: 20px;">קווי הייצור באגף — כל קו בנפרד, ללא חזרה על נתוני האגף</div>

      <div class="machine-grid">
        <sc-for list="{{drillMachines}}" as="m" hint-placeholder-count="2">
          <div class="machine-block">
            <div class="machine-block-title">{{m.name}}</div>
            <div class="stat-row">
              <sc-for list="{{m.stats}}" as="s" hint-placeholder-count="4">
                <div class="card"><div class="l">{{s.l}}</div><div class="v">{{s.v}}</div><div class="n">{{s.n}}</div></div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

</div>
</template>
<template id="view-ll">
<div class="page">

  <sc-if value="{{showBanner}}"><div class="banner">{{bannerText}}</div></sc-if>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
    <div>
      <div style="font-size: 22px; font-weight: 700; margin-bottom: 2px;">Line Lead — אגף {{deptName}}</div>
      <div style="font-size: 12.5px; color: #8A8776; margin-bottom: 14px;">מקור: דוחות OEE ואירועים גולמיים מה-MES</div>

      <div class="pbar" style="margin-bottom: 10px;">
        <span style="font-size: 12.5px; font-weight: 700; color: #5B594F; padding: 0 4px;">האגף שלי</span>
        <div class="pseg" role="group" aria-label="אגף">
          <sc-for list="{{deptChips}}" as="d" hint-placeholder-count="4">
            <button class="pseg-btn" type="button" style="{{d.style}}" onClick="{{d.pick}}">{{d.label}}</button>
          </sc-for>
        </div>
        <span style="font-size: 11.5px; color: #8A8776; margin-inline-start: auto;">הבחירה נשמרת במכשיר — בכניסה הבאה המסך נפתח ישר על האגף הזה</span>
      </div>
      <div class="pbar">
        <div class="pseg" role="group" aria-label="תקופת ניתוח">
          <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
            <button class="pseg-btn" type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button>
          </sc-for>
        </div>
        <div class="pnav">
          <button class="pnav-btn" type="button" aria-label="תקופה קודמת" style="{{prevStyle}}" onClick="{{prevFn}}">→</button>
          <span class="pnav-label">{{periodLabel}}</span>
          <button class="pnav-btn" type="button" aria-label="תקופה הבאה" style="{{nextStyle}}" onClick="{{nextFn}}">←</button>
        </div>
        <span class="psrc" style="{{srcStyle}}">{{srcLabel}}</span>
      </div>
      <div class="psrc-note">{{srcNote}}</div>

      <div class="section-title">אגף {{deptName}} — סה״כ</div>
      <div class="stat-row" style="margin-bottom: 24px;">
        <sc-for list="{{plantStats}}" as="s" hint-placeholder-count="4">
          <div class="card card-plant">
            <div class="l">{{s.l}}</div><div class="v">{{s.v}}</div><div class="n">{{s.n}}</div>
            <sc-if value="{{s.hasSrc}}" hint-placeholder-val="{{false}}"><div class="kpi-src">{{s.src}}</div></sc-if>
            <div class="kpi-tooltip">
              <div class="kpi-tooltip-title">השוואה מול תקופות קודמות</div>
              <div class="kpi-tooltip-row"><span>{{s.tt.prevLabel}}</span><b>{{s.tt.yest}}</b></div>
              <div class="kpi-tooltip-sub">{{s.tt.yestDelta}}</div>
              <div class="kpi-tooltip-row" style="margin-top:6px;"><span>{{s.tt.avgLabel}}</span><b>{{s.tt.week}}</b></div>
              <div class="kpi-tooltip-sub">{{s.tt.weekDelta}}</div>
              <div class="kpi-tooltip-note">* מאותו סוג תקופה, לפי הדוחות שהועלו. "—" = אין נתון לתקופה הזו</div>
            </div>
          </div>
        </sc-for>
      </div>

      <div class="panel" style="margin-bottom: 8px;">
        <div class="panel-title">התראות וחריגים — איפה למקד פעולה היום</div>
        <div class="panel-sub">מדורג לפי נק' OEE <b>אגפי</b> אבודות מול היעד העצמי של כל מכונה (משקל המכונה באגף × (יעד − בפועל)) — כל מכונה מול המצופה ממנה</div>

        <div class="alert-grid">
          <sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
            <div class="alert-row" style="{{a.rowStyle}}">
              <span class="alert-dot" style="{{a.dotStyle}}"></span>
              <div class="alert-text"><b>{{a.title}}</b><span>{{a.detail}}</span></div>
            </div>
          </sc-for>
        </div>
      </div>

      <div class="section-title-sub">ביצועי OEE — למה ה-OEE נמוך</div>
      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-title">OEE לפי מכונה (מהגבוה לנמוך)</div>
          <div class="panel-sub" style="margin-bottom:10px;">הקו המקווקו הוא יעד ה-OEE של המכונה (Machine_OEE_Target) · ירוק = עמדו/חצו את היעד, אדום = לא עמדו ביעד</div>
          <div class="chart-bars">
            <sc-for list="{{oeeChart}}" as="b" hint-placeholder-count="8">
              <div class="chart-col">
                <div class="bar-val-v">{{b.valueLabel}}</div>
                <div class="bar-track-v">
                  <div class="target-line" style="bottom: {{b.targetHeight}};"></div>
                  <div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div>
                </div>
                <div class="chart-name">{{b.name}}</div>
              </div>
            </sc-for>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-title">תרומה ל-OEE האגפי — ביצוע מול יעד, לפי מכונה</div>
          <div class="panel-sub" style="margin-bottom:10px;">כל שורה מנורמלת ליעד <b>שלה</b>. הסמן השחור הוא נקודת היעד (משקל המכונה באגף × יעד OEE). ירוק = עברה את הסמן, אדום = לא הגיעה אליו. המספר הבולט הוא התרומה בפועל בנקודות OEE לאגף, ולצידו יעד התרומה שלה</div>
          <div class="bullet-list">
            <sc-for list="{{contributionBulletChart}}" as="b" hint-placeholder-count="8">
              <div class="bullet-row">
                <div class="bullet-name">{{b.name}}</div>
                <div class="bullet-track">
                  <div class="bullet-fill" style="width: {{b.fillWidth}}; {{b.colorStyle}}"></div>
                  <div class="bullet-target" style="right: {{b.targetPos}};"></div>
                </div>
                <div class="bullet-values">
                  <span class="bullet-points" style="{{b.labelColorStyle}}">{{b.pointsLabel}}</span>
                  <span class="bullet-pct">{{b.targetLabel}}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>

      <div class="section-title-sub">אמינות ותפעול — מה גורם לעצירות</div>
      <div class="chart-grid">
        <div class="chart-card">
          <div class="chart-title">TDT% (זמן עצירות) לפי מכונה (מהגבוה לנמוך)</div>
          <div class="filter-tabs">
            <span class="filter-tab" style="{{tdtViewMachineTabStyle}}" onClick="{{setTdtViewMachineFn}}">לפי מכונה</span>
            <span class="filter-tab" style="{{tdtViewStationsTabStyle}}" onClick="{{setTdtViewStationsFn}}">TOP 3 תקלות לפי תחנה</span>
          </div>

          <sc-if value="{{isTdtViewMachine}}" hint-placeholder-val="{{true}}">
            <div class="panel-sub" style="margin-bottom:10px;">אחוז מזמן העבודה שהמכונה עמדה — אחד הגורמים הישירים לפער ב-OEE. אין כרגע יעד מוגדר למדד הזה, ולכן העמודות בצבע אחיד ולא ירוק/אדום</div>
            <div class="chart-bars">
              <sc-for list="{{tdtChart}}" as="b" hint-placeholder-count="8">
                <div class="chart-col">
                  <div class="bar-val-v">{{b.valueLabel}}</div>
                  <div class="bar-track-v"><div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div></div>
                  <div class="chart-name">{{b.name}}</div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{isTdtViewStations}}" hint-placeholder-val="{{false}}">
            <div class="panel-sub" style="margin-bottom:10px;">לכל מכונה — 3 התחנות עם משך מצטבר הגבוה ביותר של עצירות מסוג "תקלה" בלבד (מתוך דוח RAW הגולמי, לא סטטוסים אחרים כמו הפסקה/המתנה/סט-אפ), ממוין מהגבוה לנמוך</div>
            <div class="top3-list">
              <sc-for list="{{tdtStationFaults}}" as="m" hint-placeholder-count="8">
                <div class="top3-machine-block">
                  <div class="top3-machine-name"><span>{{m.name}}</span><span class="top3-machine-tdt">{{m.tdtLabel}}</span></div>
                  <sc-for list="{{m.stations}}" as="s" hint-placeholder-count="3">
                    <div class="top3-reason-row">
                      <div class="top3-reason-desc">{{s.station}}</div>
                      <div class="top3-reason-stats">
                        <div class="top3-reason-dur">{{s.durLabel}}</div>
                        <div class="top3-reason-count">{{s.countLabel}}</div>
                      </div>
                    </div>
                  </sc-for>
                  <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                    <div class="top3-empty">אין עצירות מסוג "תקלה" בתקופה</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <div class="chart-card">
          <div class="chart-title">MTBF (זמן ממוצע בין תקלות) לפי מכונה (מהנמוך לגבוה)</div>
          <div class="filter-tabs">
            <span class="filter-tab" style="{{mtbfViewMachineTabStyle}}" onClick="{{setMtbfViewMachineFn}}">לפי מכונה</span>
            <span class="filter-tab" style="{{mtbfViewFaultsTabStyle}}" onClick="{{setMtbfViewFaultsFn}}">TOP 3 תיאורי תקלה</span>
          </div>

          <sc-if value="{{isMtbfViewMachine}}" hint-placeholder-val="{{true}}">
            <div class="panel-sub" style="margin-bottom:10px;">שעות:דקות בין תקלה לתקלה — ככל שנמוך יותר, המכונה נכשלת בתדירות גבוהה יותר. "אין תקלות" = לא נרשמו למכונה אירועי תקלה בתקופה</div>
            <div class="chart-bars">
              <sc-for list="{{mtbfChart}}" as="b" hint-placeholder-count="8">
                <div class="chart-col">
                  <div class="bar-val-v">{{b.valueLabel}}</div>
                  <div class="bar-track-v"><div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div></div>
                  <div class="chart-name">{{b.name}}</div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{isMtbfViewFaults}}" hint-placeholder-val="{{false}}">
            <div class="panel-sub" style="margin-bottom:10px;">לכל מכונה — 3 תיאורי התקלה עם מספר המופעים הגבוה ביותר (סטטוס "תקלה" בלבד מדוח RAW), ממוין מהנמוך לגבוה ב-MTBF כמו הגרף. תיאורים <span style="font-style:italic; color:#D97706; font-weight:700;">מודגשים בכתום</span> (למשל "אחר", "עצירה לא מוסברת") אינם מסבירים את סיבת התקלה בפועל — סימן לתיעוד לקוי בשטח שכדאי לשפר, לא לתקלה חוזרת אמיתית</div>
            <div class="top3-list">
              <sc-for list="{{mtbfTop3Faults}}" as="m" hint-placeholder-count="8">
                <div class="top3-machine-block">
                  <div class="top3-machine-name"><span>{{m.name}}</span><span class="top3-machine-tdt">{{m.mtbfLabel}}</span></div>
                  <sc-for list="{{m.faults}}" as="f" hint-placeholder-count="3">
                    <div class="top3-reason-row">
                      <div class="top3-reason-desc" style="{{f.descStyle}}">{{f.desc}}</div>
                      <div class="top3-reason-station">{{f.station}}</div>
                      <div class="top3-reason-stats">
                        <div class="top3-reason-dur">{{f.countLabel}}</div>
                        <div class="top3-reason-count">{{f.durLabel}}</div>
                      </div>
                    </div>
                  </sc-for>
                  <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                    <div class="top3-empty">אין עצירות מסוג "תקלה" בתקופה</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </div>

      <div class="section-title-sub">תפוקה</div>
      <div class="chart-card">
        <div class="chart-title">תפוקה — מוחלטת ואחוז מהאגף, ביחד</div>
        <div class="filter-tabs">
          <span class="filter-tab" style="{{shareDeptTabStyle}}" onClick="{{setShareDeptFn}}">חלוקה בין המכונות</span>
          <span class="filter-tab" style="{{shareMachineTabStyle}}" onClick="{{setShareMachineFn}}">לפי מכונה</span>
          <span class="filter-tab" style="{{shareSkuTabStyle}}" onClick="{{setShareSkuFn}}">פירוט מק"טים</span>
        </div>

        <sc-if value="{{isShareMachine}}" hint-placeholder-val="{{false}}">
          <div class="panel-sub" style="margin-bottom:10px;">ממוין מהגבוה לנמוך · המספר העליון = תפוקה בפועל (SAP טובים), המספר התחתון = אחוז מתפוקת האגף</div>
          <div class="chart-bars">
            <sc-for list="{{outputCombinedChart}}" as="b" hint-placeholder-count="8">
              <div class="chart-col">
                <div class="bar-val-v">{{b.valueLabel}}</div>
                <div class="bar-val-sub">{{b.shareLabel}}</div>
                <div class="bar-track-v"><div class="bar-fill-v" style="height: {{b.barHeight}}; {{b.colorStyle}}"></div></div>
                <div class="chart-name">{{b.name}}</div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isShareDept}}" hint-placeholder-val="{{true}}">
          <div class="panel-sub" style="margin-bottom:10px;">חלוקת תפוקת האגף בין המכונות · תפוקה בפועל ואחוז מהאגף ביחד</div>
          <div class="pie-wrap-dept">
            <svg width="190" height="190" viewBox="0 0 200 200">
              <sc-for list="{{outputCombinedDeptPie}}" as="p" hint-placeholder-count="4">
                <path d="{{p.path}}" style="{{p.fillStyle}}" stroke="#fff" stroke-width="2.5"></path>
              </sc-for>
              <sc-for list="{{outputCombinedDeptPie}}" as="p" hint-placeholder-count="4">
                <sc-if value="{{p.showLabel}}" hint-placeholder-val="{{false}}">
                  <text x="{{p.labelX}}" y="{{p.labelY}}" class="pie-slice-label">
                    <tspan x="{{p.labelX}}" dy="-6">{{p.valueLabel}}</tspan>
                    <tspan x="{{p.labelX}}" dy="16" class="pie-slice-sub">{{p.shareLabel}}</tspan>
                  </text>
                </sc-if>
              </sc-for>
            </svg>
            <div class="pie-legend">
              <sc-for list="{{outputCombinedDeptPie}}" as="p" hint-placeholder-count="4">
                <div class="pie-legend-item">
                  <span class="pie-legend-dot" style="{{p.dotStyle}}"></span>
                  <span class="pie-legend-name">{{p.name}}</span>
                  <span class="pie-legend-pct">{{p.valueLabel}}</span>
                  <span class="pie-legend-sub">({{p.shareLabel}})</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{isShareSku}}" hint-placeholder-val="{{false}}">
          <div class="panel-sub" style="margin-bottom:10px;">לכל מכונה — כל המק"טים שיוצרו, ממוין מהגבוה לנמוך לפי כמות התפוקה; המכונות עצמן מסודרות כמו בגרף "לפי מכונה"</div>
          <div class="banner" style="display:block; margin-bottom:14px;">הכמויות כאן מדווחות ברמת מק"ט מתוך ה-MES ואינן בהכרח תואמות במדויק את התפוקה הרשמית מ-SAP המוצגת בגרף ובכרטיסי העל — פער הדיווח בין שתי המערכות הוא מצב קיים.</div>
          <div class="top3-list">
            <sc-for list="{{productionSkuList}}" as="m" hint-placeholder-count="8">
              <div class="top3-machine-block">
                <div class="top3-machine-name"><span>{{m.name}}</span><span class="top3-machine-tdt">{{m.totalLabel}}</span></div>
                <sc-for list="{{m.skus}}" as="p" hint-placeholder-count="4">
                  <div class="top3-reason-row">
                    <div class="top3-sku-code">{{p.sku}}</div>
                    <div class="top3-reason-desc">{{p.desc}}</div>
                    <div class="top3-reason-stats">
                      <div class="top3-reason-dur">{{p.qtyLabel}}</div>
                    </div>
                  </div>
                </sc-for>
                <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                  <div class="top3-empty">אין נתוני ייצור מק"ט בתקופה</div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>

    </div>
  </sc-if>

  <sc-if value="{{isDrill}}" hint-placeholder-val="{{false}}">
    <div>
      <button class="backbtn" onClick="{{onBack}}">→ חזרה לתצוגת המפעל</button>
      <div style="font-size: 20px; font-weight: 700; margin-bottom: 2px;">{{drillDeptName}}</div>
      <div style="font-size: 11px; color: #8A8776; margin-bottom: 20px;">קווי הייצור באגף — כל קו בנפרד, ללא חזרה על נתוני האגף</div>

      <div class="machine-grid">
        <sc-for list="{{drillMachines}}" as="m" hint-placeholder-count="2">
          <div class="machine-block">
            <div class="machine-block-title">{{m.name}}</div>
            <div class="stat-row">
              <sc-for list="{{m.stats}}" as="s" hint-placeholder-count="4">
                <div class="card"><div class="l">{{s.l}}</div><div class="v">{{s.v}}</div><div class="n">{{s.n}}</div></div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

</div>
</template>
<template id="view-pl">
<div class="page pl-page">
  <div class="banner">{{bannerText}}</div>
  <div style="font-size: 22px; font-weight: 700; margin-bottom: 2px;">Process Lead — ניתוח הפסדים</div>
  <div style="font-size: 12.5px; color: #8A8776; margin-bottom: 14px;">{{subTitle}}</div>
  <div class="pbar" style="margin-bottom: 10px;">
    <span style="font-size: 12.5px; font-weight: 700; color: #5B594F; padding: 0 4px;">קו</span>
    <div class="pseg" role="group" aria-label="קו">
      <sc-for list="{{machineChips}}" as="c" hint-placeholder-count="8">
        <button class="pl-chip" type="button" style="{{c.style}}" onClick="{{c.pick}}">{{c.name}}</button>
      </sc-for>
    </div>
  </div>
  <div class="pbar">
    <div class="pseg" role="group" aria-label="תקופה">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="3"><button class="pseg-btn" type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for>
    </div>
    <div class="pnav">
      <button class="pnav-btn" type="button" aria-label="תקופה קודמת" style="{{prevStyle}}" onClick="{{prevFn}}">→</button>
      <span class="pnav-label">{{periodLabel}}</span>
      <button class="pnav-btn" type="button" aria-label="תקופה הבאה" style="{{nextStyle}}" onClick="{{nextFn}}">←</button>
    </div>
    <span class="psrc" style="{{srcStyle}}">{{srcLabel}}</span>
  </div>
  <div class="psrc-note">{{srcNote}}</div>
  <div class="stat-row" style="margin-bottom: 22px;">
    <sc-for list="{{kpis}}" as="s" hint-placeholder-count="4">
      <div class="card card-plant"><div class="l">{{s.l}}</div><div class="v">{{s.v}}</div><sc-if value="{{s.hasSub}}" hint-placeholder-val="{{false}}"><div class="card-sub">{{s.sub}}</div></sc-if><div class="kpi-delta" style="{{s.deltaStyle}}">{{s.delta}}</div><div class="n">{{s.n}}</div></div>
    </sc-for>
  </div>
  <sc-if value="{{isDay}}" hint-placeholder-val="{{true}}"><div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">ציר הזמן של היום — מה קרה ומתי</div>
    <div class="panel-sub">כל פס צבעוני הוא אירוע מדוח ה-RAW, לפי השעה. הקווים השחורים הם החלפות משמרת (07:00 / 15:00 / 23:00)</div>
    <div class="tl-shiftnames"><div>בוקר · 07:00 עד 15:00</div><div>ערב · 15:00 עד 23:00</div><div>לילה · 23:00 עד 07:00</div></div>
    <div class="tl-wrap">
      <div class="tl-bar">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="30"><div class="tl-seg" style="{{s.style}}" title="{{s.title}}"></div></sc-for>
      </div>
      <div class="tl-shift" style="right: 33.333%;"></div>
      <div class="tl-shift" style="right: 66.666%;"></div>
    </div>
    <div class="tl-ticks">
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="12"><span class="tl-tick" style="{{t.style}}">{{t.label}}</span></sc-for>
    </div>
    <div class="leg">
      <sc-for list="{{legend}}" as="l" hint-placeholder-count="6"><span class="leg-item"><span class="leg-sw" style="{{l.style}}"></span>{{l.name}}</span></sc-for>
    </div>
  </div>
  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">פארטו הפסדים — היום</div>
    <div class="panel-sub">כל ההפסדים של היום (תקלות, המתנות ופעילויות), מהגדול לקטן. הקו השחור בכל שורה הוא האחוז המצטבר. הקו השחור בכל שורה הוא האחוז המצטבר מכלל ההפסד של היום</div>
    <sc-for list="{{pareto}}" as="p" hint-placeholder-count="10">

    <div class="panel-title">יומן התקלות של היום (5 דקות ומעלה)</div>
    <div class="panel-sub">לפי סדר השעות — הבסיס למסירה למשמרת הבאה ולפתיחת תחקיר</div>
    <div class="log-row ml-head"><div>שעה</div><div>משך</div><div>תחנה</div><div>תיאור התקלה</div></div>
    <sc-for list="{{log}}" as="e" hint-placeholder-count="14">
      <div class="log-row">
        <div class="ev-time">{{e.t}}</div>
        <div class="ev-dur" style="{{e.durStyle}}">{{e.dur}}</div>
        <div>{{e.station}}</div>
        <div>{{e.desc}}</div>
      </div>
    </sc-for>
  </div>

</sc-if><sc-if value="{{isWeek}}" hint-placeholder-val="{{false}}"><div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">מגמת אמינות — 4 שבועות</div>
    <div class="panel-sub">MTBF הוא הזמן הממוצע בין תקלה לתקלה — ככל שהוא עולה הציוד אמין יותר. מתחת לכל עמודה ה-MTTR של אותו שבוע: כמה זמן לקח בממוצע להחזיר את הקו לעבודה</div>
    <div class="trend-grid">
      <sc-for list="{{weeks}}" as="x" hint-placeholder-count="4">
        <div class="trend-col">
          <div class="trend-val">{{x.val}}</div>
          <div class="trend-bar-wrap"><div class="trend-bar" style="{{x.barStyle}}"></div></div>
          <div class="trend-name">{{x.name}}</div>
          <div class="trend-delta" style="{{x.deltaStyle}}">{{x.delta}}</div>
          <div class="mt-sub">{{x.mttr}}</div>
        </div>
      </sc-for>
    </div>
    <div class="panel-sub" style="margin-top: 12px;">{{trendNote}}</div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">יום אחרי יום — כמה זמן הקו היה מושבת בגלל שבר</div>
    <div class="panel-sub">מעל כל עמודה ה-MTBF של אותו יום. העמודה מראה את זמן ההשבתה: אדום — תיקוני שבר, כחול — אחזקה מתוכננת שבוצעה באותו יום</div>
    <div class="pm-grid">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div>
          <div class="day-head"><div class="day-oee">{{d.mtbf}}</div></div>
          <div class="pm-stack"><sc-for list="{{d.parts}}" as="p" hint-placeholder-count="2"><div style="{{p.style}}"></div></sc-for></div>
          <div class="buck-name">{{d.name}}</div>
          <div class="buck-sub">{{d.txt}}</div>
        </div>
      </sc-for>
    </div>
    <div class="leg">
      <sc-for list="{{legend}}" as="l" hint-placeholder-count="2"><span class="leg-item"><span class="leg-sw" style="{{l.style}}"></span>{{l.name}}</span></sc-for>
    </div>
    <div class="panel-sub" style="margin-top: 10px;">{{dayNote}}</div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">תחנות — השבוע מול השבוע הקודם</div>
    <div class="panel-sub">איזו תחנה צורכת הכי הרבה זמן אחזקה, והאם היא החמירה או השתפרה. תחנה שהחמירה שבוע אחרי שבוע היא היעד הראשון לתוכנית BDE</div>
    <div class="ml-row ml-head"><div>תחנה</div><div>משך מצטבר השבוע</div><div>סה"כ</div><div>מס\' תקלות</div><div>מול השבוע הקודם</div></div>
    <sc-for list="{{stations}}" as="s" hint-placeholder-count="8">
      <div class="ml-row">
        <div><b>{{s.name}}</b><span class="mt-sub">MTTR {{s.mttr}} · {{s.days}}</span></div>
        <div class="par-track"><div class="par-fill" style="{{s.fillStyle}}"></div></div>
        <div class="par-min">{{s.tot}}</div>
        <div>{{s.n}}</div>
        <div><span class="chg" style="{{s.chgStyle}}">{{s.chg}}</span></div>
      </div>
    </sc-for>
    <div class="panel-sub" style="margin-top: 10px;">{{stationNote}}</div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">תקלות חוזרות — מגמה לאורך 4 שבועות (מועמדות ל-BDE)</div>
    <div class="panel-sub">כמה דקות הלכו על כל תקלה בכל שבוע. תקלה שנשארת גבוהה או עולה היא מועמדת ל-UPS ולעדכון תוכנית האחזקה; תקלה שירדה מראה שהפעולה שנעשתה עבדה וניתן לסגור את ה-BDE</div>
    <div class="rec-row rec-head" style="grid-template-columns: minmax(0,1.6fr) repeat(4, 56px) 70px 78px 190px;">
      <div>תקלה · תחנה</div>
      <sc-for list="{{weekCols}}" as="c" hint-placeholder-count="4"><div style="text-align: center;">{{c}}</div></sc-for>
      <div>סה"כ</div><div>מופעים</div><div>מצב</div>
    </div>
    <sc-for list="{{recurring}}" as="r" hint-placeholder-count="10">
      <div class="rec-row" style="grid-template-columns: minmax(0,1.6fr) repeat(4, 56px) 70px 78px 190px;">
        <div class="par-desc"><b>{{r.desc}}</b><span>{{r.sub}}</span></div>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><div class="rec-cell" style="{{c.style}}">{{c.v}}</div></sc-for>
        <div class="par-min">{{r.tot}}</div>
        <div class="par-cumtxt">{{r.n}}</div>
        <div class="rec-tag" style="{{r.tagStyle}}">{{r.tag}}</div>
      </div>
    </sc-for>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">אחזקה מתוכננת מול שבר — 4 שבועות</div>
    <div class="panel-sub">היעד ב-IWS הוא להעביר זמן מהעמודה האדומה (תיקון אחרי שנשבר) לכחולה (אחזקה מתוכננת ומונעת). מימין באחוזים — חלק האחזקה המתוכננת מסך זמן האחזקה של אותו שבוע</div>
    <sc-for list="{{pmWeeks}}" as="p" hint-placeholder-count="4">
      <div class="pmw-row">
        <div><b>{{p.name}}</b><span class="mt-sub">{{p.sub}}</span></div>
        <div class="split-bar"><sc-for list="{{p.segs}}" as="s" hint-placeholder-count="2"><div class="split-seg" style="{{s.style}}">{{s.label}}</div></sc-for></div>
        <div class="par-min">{{p.pct}}</div>
        <div class="par-cumtxt">{{p.days}}</div>
      </div>
    </sc-for>
    <div class="panel-sub" style="margin-top: 10px;">{{pmNote}}</div>
  </div>

  <div class="panel">
    <div class="panel-title">פיזור זמני התיקון — השבוע מול השבוע הקודם</div>
    <div class="panel-sub">כמה תקלות היו בכל טווח זמן. ירידה במיקרו-עצירות מצביעה על שיפור בתנאי הבסיס; ירידה בתקלות הארוכות מצביעה על כך שה-BDE עבד</div>
    <div class="buck-grid">
      <sc-for list="{{buckets}}" as="b" hint-placeholder-count="5">
        <div>
          <div class="trend-val" style="text-align: center;">{{b.n}}</div>
          <div class="buck-wrap">
            <div class="buck-bar" style="{{b.prevStyle}}"></div>
            <div class="buck-bar" style="{{b.curStyle}}"></div>
          </div>
          <div class="buck-name">{{b.name}}</div>
          <div class="buck-sub">{{b.tot}}</div>
        </div>
      </sc-for>
    </div>
    <div class="leg">
      <sc-for list="{{buckLegend}}" as="l" hint-placeholder-count="2"><span class="leg-item"><span class="leg-sw" style="{{l.style}}"></span>{{l.name}}</span></sc-for>
    </div>
    <div class="panel-sub" style="margin-top: 10px;">{{buckNote}}</div>
  </div>

</sc-if><sc-if value="{{isMonth}}" hint-placeholder-val="{{false}}"><div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">מגמת אמינות לאורך החודש</div>
    <div class="panel-sub">MTBF שבועי — הזמן הממוצע בין תקלה לתקלה. מתחת לכל עמודה: ה-MTTR של אותו שבוע וחלק האחזקה המתוכננת מזמן האחזקה. זו התמונה שה-ML מביא לסקירה החודשית</div>
    <div class="trend-grid" style="grid-template-columns: repeat(5, minmax(0,1fr));">
      <sc-for list="{{weeks}}" as="x" hint-placeholder-count="5">
        <div class="trend-col">
          <div class="trend-val">{{x.val}}</div>
          <div class="trend-bar-wrap"><div class="trend-bar" style="{{x.barStyle}}"></div></div>
          <div class="trend-name">{{x.name}}</div>
          <div class="trend-delta" style="{{x.deltaStyle}}">{{x.delta}}</div>
          <div class="mt-sub">{{x.sub}}</div>
        </div>
      </sc-for>
    </div>
    <div class="panel-sub" style="margin-top: 12px;">{{trendNote}}</div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">אמינות לפי תחנה — כל החודש</div>
    <div class="panel-sub">MTBF לתחנה = זמן הייצור של הקו חלקי מספר התקלות באותה תחנה: כל כמה זמן ייצור התחנה הזו מפילה את הקו. MTTR גבוה עם מעט תקלות = כשל ציוד; MTBF נמוך עם MTTR נמוך = תנאי בסיס</div>
    <div class="rel-row rel-head"><div>תחנה</div><div>משך מצטבר</div><div>סה"כ</div><div>תקלות</div><div>MTBF</div><div>MTTR</div></div>
    <sc-for list="{{stations}}" as="s" hint-placeholder-count="9">
      <div class="rel-row">
        <div><b>{{s.name}}</b><span class="mt-sub">{{s.days}}</span></div>
        <div class="par-track"><div class="par-fill" style="{{s.fillStyle}}"></div></div>
        <div class="par-min">{{s.tot}}</div>
        <div>{{s.n}}</div>
        <div class="par-min">{{s.mtbf}}</div>
        <div>{{s.mttr}}</div>
      </div>
    </sc-for>
    <div class="panel-sub" style="margin-top: 10px;">{{stationNote}}</div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">איפה מרוכז זמן ההשבתה</div>
    <div class="panel-sub">מספר האירועים בכל טווח זמן, ומתחת — כמה זמן הם לקחו וכמה אחוז מזמן השבר של החודש. זו ההחלטה בין תוכנית BDE לתקלות הגדולות לבין תחזוקה אוטונומית למיקרו-עצירות</div>
    <div class="conc-grid">
      <sc-for list="{{conc}}" as="c" hint-placeholder-count="5">
        <div>
          <div class="trend-val" style="text-align: center;">{{c.n}}</div>
          <div class="conc-wrap"><div class="conc-bar" style="{{c.barStyle}}"></div></div>
          <div class="conc-name">{{c.name}}</div>
          <div class="conc-sub">{{c.tot}}</div>
          <div class="conc-sub" style="font-weight: 700; color: #14140F;">{{c.pct}}</div>
        </div>
      </sc-for>
    </div>
    <div class="panel-sub" style="margin-top: 12px;">{{concNote}}</div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <div class="panel-title">תיק ה-BDE לחודש הבא — חמש התקלות הכבדות</div>
    <div class="panel-sub">לפי זמן מצטבר בחודש. &quot;כרונית&quot; = חוזרת בהרבה ימים וזמן קצר לתיקון — מטפלים בשורש דרך UPS ותוכנית PM. &quot;ספוראדית&quot; = מעט מופעים וזמן ארוך — מטפלים ב-IPS ובתחקיר כשל. הפוטנציאל מחושב כהפחתה של חצי מהזמן</div>
    <div class="bde-row rel-head"><div>#</div><div>תקלה · תחנה</div><div>זמן בחודש</div><div>מופעים</div><div>פוטנציאל</div><div>אופי ופעולה</div></div>
    <sc-for list="{{bde}}" as="b" hint-placeholder-count="5">
      <div class="bde-row">
        <div class="par-rank">{{b.rank}}</div>
        <div class="par-desc"><b>{{b.desc}}</b><span>{{b.sub}}</span></div>
        <div class="par-min">{{b.tot}}</div>
        <div>{{b.n}}</div>
        <div class="bde-gain">{{b.gain}}</div>
        <div class="rec-tag" style="{{b.tagStyle}}">{{b.tag}}</div>
      </div>
    </sc-for>
    <div class="panel-sub" style="margin-top: 12px;">{{bdeNote}}</div>
  </div>

  <div class="panel">
    <div class="panel-title">אחזקה מתוכננת מול שבר — לאורך החודש</div>
    <div class="panel-sub">כמה מזמן האחזקה היה מתוכנן וכמה היה תיקון חירום אחרי שבר. המדד ב-IWS הוא עמידה בתוכנית ה-PM ומעבר הדרגתי מהאדום לכחול</div>
    <sc-for list="{{pmWeeks}}" as="p" hint-placeholder-count="5">
      <div class="pmw-row">
        <div><b>{{p.name}}</b><span class="mt-sub">{{p.sub}}</span></div>
        <div class="split-bar"><sc-for list="{{p.segs}}" as="s" hint-placeholder-count="2"><div class="split-seg" style="{{s.style}}">{{s.label}}</div></sc-for></div>
        <div class="par-min">{{p.pct}}</div>
        <div class="par-cumtxt">{{p.days}}</div>
      </div>
    </sc-for>
    <div class="panel-sub" style="margin-top: 12px;">{{pmNote}}</div>
  </div>

</sc-if></div></template>
<script src="./api.js"></script>
<script src="./router.js"></script>
<script src="./engine.js"></script>
<script src="./dashdata.js"></script>
<script src="./app.js"></script>
<script src="./component.js"></script>
<script src="./pl.js"></script>
<script src="./ml.js"></script>
<script src="./iws.js"></script>
<script src="./dds.js"></script>
<script src="./settings.js"></script>
<script src="./upload.js"></script>
</body>
</html>
